<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UAsset Preview</title>
  <style>
    :root {
      --bg: #1a1a1e; --surface: #242429; --text: #e8e8ec; --muted: #9a9aa3;
      --accent: #6c8cff; --border: #33333a; --err: #f07178;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, Segoe UI, sans-serif; }
    .pane { display: flex; flex-direction: column; height: 100%; }
    .hdr { padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .hdr h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; word-break: break-all; }
    .meta { color: var(--muted); font-size: 12px; }
    .meta strong { color: var(--text); font-weight: 500; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    button { background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: default; }
    .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .img-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; overflow: auto; }
    .img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: auto; }
    #viewer { flex: 1; min-height: 220px; }
    .mat-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px; }
    .mat-wrap canvas { border: 1px solid var(--border); border-radius: 4px; }
    .mat-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .mat-bar button { padding: 2px 8px; font-size: 12px; }
    .mat-bar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    .note { padding: 6px 12px; color: var(--muted); border-bottom: 1px solid var(--border); font-size: 12px; }
    .banner { padding: 8px 12px; background: #2a2a14; color: #e6d27a; border-bottom: 1px solid var(--border); }
    .err { color: var(--err); padding: 8px 12px; }
    .status { color: var(--muted); padding: 12px; }
    details { border-top: 1px solid var(--border); background: var(--surface); }
    details summary { padding: 8px 12px; cursor: pointer; color: var(--muted); }
    #tree { max-height: 40vh; }
    pre { margin: 0; padding: 8px 12px; max-height: 180px; overflow: auto; font: 11px/1.35 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
<div class="pane">
  <div class="hdr">
    <h1 id="title">…</h1>
    <div class="meta" id="meta"></div>
    <div class="actions">
      <button type="button" id="btn-open">Open in UEFN</button>
      <button type="button" id="btn-copy">Copy asset path</button>
      <button type="button" id="btn-umg" hidden>Interactive preview</button>
      <button type="button" id="btn-mesh" hidden>Load 3D preview</button>
      <button type="button" id="btn-live" hidden>Live material</button>
      <button type="button" id="btn-mat" hidden>Load material preview</button>
      <button type="button" id="btn-tex" hidden>Load texture preview</button>
    </div>
  </div>
  <div id="banner" class="banner" hidden></div>
  <div id="mat-note" class="note" hidden></div>
  <div id="err" class="err" hidden></div>
  <div class="body">
    <div id="status" class="status">Loading…</div>
    <div class="img-wrap" id="img-wrap" hidden><img id="thumb" alt="preview" /></div>
    <div id="viewer" hidden></div>
    <div class="mat-wrap" id="mat-wrap" hidden>
      <canvas id="mat"></canvas>
      <div class="mat-bar">
        <span>Background</span>
        <button type="button" data-bg="checker" aria-pressed="true">Checker</button>
        <button type="button" data-bg="dark" aria-pressed="false">Dark</button>
        <button type="button" data-bg="light" aria-pressed="false">Light</button>
        <span id="mat-info"></span>
      </div>
    </div>
  </div>
  <details id="tree-details" open hidden>
    <summary>Widget tree</summary>
    <pre id="tree"></pre>
  </details>
  <details id="hex-details" hidden>
    <summary>View raw (hex)</summary>
    <pre id="hex"></pre>
  </details>
</div>
<script src="viewer.bundle.js"></script>
<script src="umg/material.js"></script>
<script src="umg/engine.js"></script>
<script>
(function () {
  var CHANNEL = "uefn-plugin-ui";
  function call(method, params) {
    var id = crypto.randomUUID();
    return new Promise(function (resolve, reject) {
      var timer = window.setTimeout(function () {
        window.removeEventListener("message", onMsg);
        reject(new Error("Timed out talking to host"));
      }, 60000);
      function onMsg(ev) {
        var d = ev.data;
        if (!d || d.channel !== CHANNEL || d.id !== id) return;
        window.clearTimeout(timer);
        window.removeEventListener("message", onMsg);
        if (d.ok) resolve(d.result);
        else reject(new Error(d.error || "bridge error"));
      }
      window.addEventListener("message", onMsg);
      parent.postMessage({ channel: CHANNEL, id: id, method: method, params: params || {} }, "*");
    });
  }
  function rpc(method, params) { return call("plugin.call", { method: method, params: params || {} }); }

  function basename(p) {
    var s = String(p || "").replace(/\\/g, "/");
    var i = s.lastIndexOf("/");
    return i >= 0 ? s.slice(i + 1) : s;
  }

  var filePath = "";
  var result = null;
  var viewer = null;

  function showErr(msg) {
    var el = document.getElementById("err");
    if (!msg) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false; el.textContent = msg;
  }

  function setBanner(msg) {
    var el = document.getElementById("banner");
    if (!msg) { el.hidden = true; return; }
    el.hidden = false; el.textContent = msg;
  }

  async function ensureFilePath() {
    var info = await call("plugin.info", {});
    filePath = (info && info.filePath) || "";
    if (!filePath) {
      try {
        filePath = new URLSearchParams(location.search).get("file") || "";
      } catch (e) {}
    }
    if (!filePath) throw new Error("No file path from host");
  }

  function renderMeta(r) {
    document.getElementById("title").textContent = basename(filePath);
    var lines = [];
    if (r.asset_class) lines.push("<div><strong>Class:</strong> " + escapeHtml(r.asset_class) + "</div>");
    if (r.asset_path) lines.push("<div><strong>Asset:</strong> " + escapeHtml(r.asset_path) + "</div>");
    if (r.preview_kind) lines.push("<div><strong>Kind:</strong> " + escapeHtml(r.preview_kind) + "</div>");
    if (r.verse_source) lines.push("<div><strong>Verse:</strong> " + escapeHtml(r.verse_source) + "</div>");
    document.getElementById("meta").innerHTML = lines.join("");
    document.getElementById("btn-mesh").hidden = !r.supports_mesh_preview;
    document.getElementById("btn-mat").hidden = !r.supports_material_preview;
    document.getElementById("btn-tex").hidden = !r.supports_texture_preview;
    if (!r.listener_online) setBanner("UEFN listener offline — showing local badge / cached preview.");
    else setBanner("");
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  // ---- live material: the graph compiled to a shader (ui/umg/material.js, as in the UMG preview)
  var live = null; // { material, renderer, images, background, raf }
  var MAT_MAX_PX = 1024;

  function noteMaterial(msg) {
    var el = document.getElementById("mat-note");
    el.hidden = !msg; el.textContent = msg || "";
  }

  function loadTexture(key, asset) {
    return new Promise(function (resolve) {
      if (!asset || !asset.url) { resolve(null); return; }
      var img = new Image();
      img.crossOrigin = "anonymous"; // the panel is sandboxed: pixels are readable only through CORS
      img.onload = function () {
        // Content Browser thumbnails bake a grey checkerboard where the texture is transparent
        var clean = asset.quality === "thumbnail" && window.UmgEngine && window.UmgEngine.removeChecker;
        resolve(clean ? window.UmgEngine.removeChecker(img) : img);
      };
      img.onerror = function () { resolve(null); };
      img.src = asset.url;
    });
  }

  /* Resolves to "" once the material is on screen, else to the reason it is not. */
  async function startLiveMaterial() {
    if (!window.UmgMaterial) return "the shader builder (umg/material.js) is missing";
    var res = await rpc("load_material_shader", { relative_path: filePath });
    if (!res || !res.ok) return (res && res.error) || "the material could not be read";
    var material = window.UmgMaterial.compile(res.graph);
    if (!material.ok) return material.error;
    var renderer = window.UmgMaterial.createRenderer();
    if (!renderer) return "WebGL is not available in this panel";
    var images = {}, missing = [], thumbs = 0;
    await Promise.all(material.textures.map(function (key) {
      var asset = (res.textures || {})[key];
      return loadTexture(key, asset).then(function (img) {
        if (img) { images[key] = img; if (asset.quality === "thumbnail") thumbs++; }
        else missing.push((asset && asset.name) || key.split(".").pop());
      });
    }));
    if (missing.length) return "texture " + missing.join(", ") + " could not be loaded";
    stopLiveMaterial();
    live = { material: material, renderer: renderer, images: images, background: (live && live.background) || "checker",
             startedAt: performance.now(), raf: 0, frames: 0 };
    var info = [res.graph.blend.replace("BLEND_", ""), Object.keys(res.graph.nodes).length + " nodes"];
    if (material.usesTime) info.push("animated");
    if (thumbs) info.push(thumbs + " texture" + (thumbs > 1 ? "s" : "") + " from thumbnails");
    document.getElementById("mat-info").textContent = "· " + info.join(" · ");
    showLive();
    if (!drawLive()) {
      var why = material.error || "the shader did not draw";
      stopLiveMaterial();
      return why;
    }
    return "";
  }

  function stopLiveMaterial() {
    if (live && live.raf) cancelAnimationFrame(live.raf);
    if (live) live.raf = 0;
  }

  function showLive() {
    document.getElementById("status").hidden = true;
    document.getElementById("viewer").hidden = true;
    document.getElementById("img-wrap").hidden = true;
    document.getElementById("mat-wrap").hidden = false;
    document.getElementById("btn-live").hidden = true;
    var btn = document.getElementById("btn-mat");
    btn.hidden = false; btn.textContent = "UEFN thumbnail";
  }

  function paintBackground(ctx, w, h, kind) {
    if (kind === "dark" || kind === "light") {
      ctx.fillStyle = kind === "dark" ? "#000" : "#fff";
      ctx.fillRect(0, 0, w, h);
      return;
    }
    var cell = Math.max(8, Math.round(w / 16));
    ctx.fillStyle = "#3a3a3a"; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#5c5c5c";
    for (var y = 0; y * cell < h; y++) for (var x = 0; x * cell < w; x++) if ((x + y) & 1) ctx.fillRect(x * cell, y * cell, cell, cell);
  }

  /* Draws one frame; an animated material (it reads Time) asks for the next one. */
  function drawLive() {
    if (!live) return false;
    var canvas = document.getElementById("mat"), wrap = document.getElementById("mat-wrap");
    var side = Math.max(64, Math.min(wrap.clientWidth - 24, wrap.clientHeight - 56));
    var dpr = window.devicePixelRatio || 1, px = Math.min(MAT_MAX_PX, Math.round(side * dpr));
    if (canvas.width !== px) { canvas.width = canvas.height = px; }
    canvas.style.width = canvas.style.height = side + "px";
    var ok = live.renderer.render(live.material, px, px, {
      time: (performance.now() - live.startedAt) / 1000, tint: [1, 1, 1, 1], images: live.images
    });
    if (!ok) return false;
    var ctx = canvas.getContext("2d"), r = live.renderer.region;
    paintBackground(ctx, px, px, live.background);
    ctx.save();
    if (live.material.additive) ctx.globalCompositeOperation = "lighter";
    ctx.drawImage(live.renderer.canvas, r.x, r.y, r.w, r.h, 0, 0, px, px);
    ctx.restore();
    live.frames++;
    live.drawnAt = performance.now();
    if (live.material.usesTime && !live.raf) nextFrame();
    return true;
  }

  // 60 images a second are plenty, whatever the screen's rate (as in the UMG preview)
  var MAT_FRAME_MS = 1000 / 60 - 2;
  function nextFrame() {
    live.raf = requestAnimationFrame(function (now) {
      live.raf = 0;
      if (document.getElementById("mat-wrap").hidden) return;
      if (now - live.drawnAt < MAT_FRAME_MS) nextFrame();
      else drawLive();
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-bg]"), function (btn) {
    btn.onclick = function () {
      if (!live) return;
      live.background = btn.getAttribute("data-bg");
      Array.prototype.forEach.call(document.querySelectorAll("[data-bg]"), function (b) { b.setAttribute("aria-pressed", String(b === btn)); });
      drawLive();
    };
  });
  window.addEventListener("resize", function () { if (live && !document.getElementById("mat-wrap").hidden && !live.raf) drawLive(); });
  window.__matPreview = function () {
    return live ? { frames: live.frames, animated: live.material.usesTime, textures: Object.keys(live.images).length,
                    error: live.material.error || "" } : null;
  };

  function showImage(url) {
    stopLiveMaterial();
    document.getElementById("mat-wrap").hidden = true;
    if (live) document.getElementById("btn-live").hidden = false;
    document.getElementById("status").hidden = true;
    document.getElementById("viewer").hidden = true;
    var wrap = document.getElementById("img-wrap");
    wrap.hidden = false;
    document.getElementById("thumb").src = url || "";
  }

  async function showMesh(media) {
    document.getElementById("status").hidden = true;
    document.getElementById("img-wrap").hidden = true;
    var host = document.getElementById("viewer");
    host.hidden = false;
    if (!viewer) {
      if (!window.UassetViewer) throw new Error("viewer.bundle.js missing — run npm run build:ui");
      viewer = window.UassetViewer.createViewer(host, { maxPixelRatio: 1.5 });
    }
    await viewer.setMedia(media);
  }

  async function loadWidgetTree() {
    var pre = document.getElementById("tree");
    document.getElementById("tree-details").hidden = false;
    pre.textContent = "Reading widget tree from UEFN…";
    try {
      var res = await rpc("load_widget_tree", { relative_path: filePath });
      if (!res || res.ok === false) throw new Error((res && res.error) || "Could not read widget tree");
      var lines = [];
      if (res.variables && res.variables.length) lines.push("Variables: " + res.variables.join(", "), "");
      (res.widgets || []).forEach(function (w) {
        lines.push(new Array(w.depth + 1).join("  ") + w.name + "  (" + w.class + ")" + (w.is_variable ? "  [variable]" : ""));
      });
      pre.textContent = lines.join("\n") || "Empty widget tree.";
    } catch (e) {
      pre.textContent = e.message || String(e);
    }
  }

  async function loadHex() {
    try {
      var hex = await rpc("read_hex", { relative_path: filePath });
      if (hex && hex.content) {
        document.getElementById("hex-details").hidden = false;
        document.getElementById("hex").textContent = hex.content;
      }
    } catch (e) {}
  }

  async function boot() {
    await ensureFilePath();
    document.getElementById("title").textContent = basename(filePath);
    result = await rpc("preview_asset", { relative_path: filePath });
    renderMeta(result || {});
    // Widget Blueprints open in the interactive player; "Asset details" there comes back here.
    var wantsDetails = false;
    try { wantsDetails = new URLSearchParams(location.search).get("details") === "1"; } catch (e) {}
    if (result && result.preview_kind === "widget") {
      if (!wantsDetails) { location.replace("umg.html?file=" + encodeURIComponent(filePath)); return; }
      document.getElementById("btn-umg").hidden = false;
    }
    // A UI material is drawn by its own shader (no UEFN needed); anything else keeps its thumbnail.
    var liveShown = false;
    if (result && result.preview_kind === "material") {
      var why = "";
      try { why = await startLiveMaterial(); } catch (e) { why = e.message || String(e); }
      liveShown = !why;
      noteMaterial(why ? "Live material unavailable: " + why + ". Showing the UEFN thumbnail." : "");
    }
    if (liveShown) {
      // drawn live
    } else if (result && result.preview_url && (result.mode === "texture" || result.mode === "material" || result.mode === "image" || result.mode === "badge" || result.mode === "asset" || result.mode === "verse")) {
      showImage(result.preview_url);
    } else {
      document.getElementById("status").textContent = "No thumbnail yet. Use the buttons above when UEFN is online.";
    }
    if (result && result.supports_widget_tree && result.listener_online) loadWidgetTree();
    if (!result || result.listener_online === false || result.fallback) await loadHex();

    // Auto-load mesh / material / texture when kind is clear.
    if (result && result.supports_mesh_preview && result.listener_online) {
      document.getElementById("btn-mesh").click();
    } else if (result && result.supports_material_preview && result.listener_online && !liveShown) {
      document.getElementById("btn-mat").click();
    } else if (result && result.supports_texture_preview && result.listener_online) {
      document.getElementById("btn-tex").click();
    }
  }

  document.getElementById("btn-open").onclick = function () {
    showErr("");
    rpc("open_asset_in_uefn", { relative_path: filePath }).then(function (res) {
      if (res && res.ok === false) showErr(res.error || "Could not open in UEFN");
    }).catch(function (e) { showErr(e.message); });
  };
  document.getElementById("btn-umg").onclick = function () {
    location.href = "umg.html?file=" + encodeURIComponent(filePath);
  };
  document.getElementById("btn-copy").onclick = function () {
    var p = (result && result.asset_path) || "";
    if (p && navigator.clipboard) navigator.clipboard.writeText(p);
  };
  document.getElementById("btn-mesh").onclick = function () {
    showErr("");
    document.getElementById("status").hidden = false;
    document.getElementById("status").textContent = "Exporting StaticMesh FBX…";
    rpc("load_static_mesh_preview", { relative_path: filePath }).then(function (res) {
      if (!res || !res.media_url) throw new Error((res && res.error) || "Mesh export failed");
      return showMesh(res);
    }).catch(function (e) {
      document.getElementById("status").textContent = "";
      showErr(e.message);
      loadHex();
    });
  };
  document.getElementById("btn-mat").onclick = function () {
    showErr("");
    if (live && result && result.preview_url) {
      showImage(result.preview_url); // the thumbnail already known, at once
      if (!result.listener_online) return;
    }
    rpc("load_material_preview", { relative_path: filePath }).then(function (res) {
      if (!res || !res.preview_url) throw new Error((res && res.error) || "Material preview failed");
      result = Object.assign({}, result || {}, res);
      renderMeta(result);
      showImage(res.preview_url);
    }).catch(function (e) { showErr(e.message); });
  };
  document.getElementById("btn-live").onclick = function () {
    showErr("");
    if (!live) return;
    showLive();
    drawLive();
  };
  document.getElementById("btn-tex").onclick = function () {
    showErr("");
    rpc("load_texture_preview", { relative_path: filePath }).then(function (res) {
      if (!res || !res.preview_url) throw new Error((res && res.error) || "Texture preview failed");
      result = Object.assign({}, result || {}, res);
      renderMeta(result);
      showImage(res.preview_url);
    }).catch(function (e) { showErr(e.message); });
  };

  boot().catch(function (e) {
    document.getElementById("status").textContent = "";
    showErr(e.message || String(e));
  });
})();
</script>
</body>
</html>
