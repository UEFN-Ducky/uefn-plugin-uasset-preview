<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UAsset Preview</title>
  <style>
    :root {
      --bg: #1a1a1e; --surface: #242429; --text: #e8e8ec; --muted: #9a9aa3;
      --accent: #6c8cff; --border: #33333a; --err: #f07178;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, Segoe UI, sans-serif; }
    .pane { display: flex; flex-direction: column; height: 100%; }
    .hdr { padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .hdr h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; word-break: break-all; }
    .meta { color: var(--muted); font-size: 12px; }
    .meta strong { color: var(--text); font-weight: 500; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    button { background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: default; }
    .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .img-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; overflow: auto; }
    .img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: auto; }
    #viewer { flex: 1; min-height: 220px; }
    .banner { padding: 8px 12px; background: #2a2a14; color: #e6d27a; border-bottom: 1px solid var(--border); }
    .err { color: var(--err); padding: 8px 12px; }
    .status { color: var(--muted); padding: 12px; }
    details { border-top: 1px solid var(--border); background: var(--surface); }
    details summary { padding: 8px 12px; cursor: pointer; color: var(--muted); }
    pre { margin: 0; padding: 8px 12px; max-height: 180px; overflow: auto; font: 11px/1.35 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
<div class="pane">
  <div class="hdr">
    <h1 id="title">…</h1>
    <div class="meta" id="meta"></div>
    <div class="actions">
      <button type="button" id="btn-open">Open in UEFN</button>
      <button type="button" id="btn-copy">Copy asset path</button>
      <button type="button" id="btn-mesh" hidden>Load 3D preview</button>
      <button type="button" id="btn-mat" hidden>Load material preview</button>
      <button type="button" id="btn-tex" hidden>Load texture preview</button>
    </div>
  </div>
  <div id="banner" class="banner" hidden></div>
  <div id="err" class="err" hidden></div>
  <div class="body">
    <div id="status" class="status">Loading…</div>
    <div class="img-wrap" id="img-wrap" hidden><img id="thumb" alt="preview" /></div>
    <div id="viewer" hidden></div>
  </div>
  <details id="hex-details" hidden>
    <summary>View raw (hex)</summary>
    <pre id="hex"></pre>
  </details>
</div>
<script src="viewer.bundle.js"></script>
<script>
(function () {
  var CHANNEL = "uefn-plugin-ui";
  function call(method, params) {
    var id = crypto.randomUUID();
    return new Promise(function (resolve, reject) {
      var timer = window.setTimeout(function () {
        window.removeEventListener("message", onMsg);
        reject(new Error("Timed out talking to host"));
      }, 60000);
      function onMsg(ev) {
        var d = ev.data;
        if (!d || d.channel !== CHANNEL || d.id !== id) return;
        window.clearTimeout(timer);
        window.removeEventListener("message", onMsg);
        if (d.ok) resolve(d.result);
        else reject(new Error(d.error || "bridge error"));
      }
      window.addEventListener("message", onMsg);
      parent.postMessage({ channel: CHANNEL, id: id, method: method, params: params || {} }, "*");
    });
  }
  function rpc(method, params) { return call("plugin.call", { method: method, params: params || {} }); }

  function basename(p) {
    var s = String(p || "").replace(/\\/g, "/");
    var i = s.lastIndexOf("/");
    return i >= 0 ? s.slice(i + 1) : s;
  }

  var filePath = "";
  var result = null;
  var viewer = null;

  function showErr(msg) {
    var el = document.getElementById("err");
    if (!msg) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false; el.textContent = msg;
  }

  function setBanner(msg) {
    var el = document.getElementById("banner");
    if (!msg) { el.hidden = true; return; }
    el.hidden = false; el.textContent = msg;
  }

  async function ensureFilePath() {
    var info = await call("plugin.info", {});
    filePath = (info && info.filePath) || "";
    if (!filePath) {
      try {
        filePath = new URLSearchParams(location.search).get("file") || "";
      } catch (e) {}
    }
    if (!filePath) throw new Error("No file path from host");
  }

  function renderMeta(r) {
    document.getElementById("title").textContent = basename(filePath);
    var lines = [];
    if (r.asset_class) lines.push("<div><strong>Class:</strong> " + escapeHtml(r.asset_class) + "</div>");
    if (r.asset_path) lines.push("<div><strong>Asset:</strong> " + escapeHtml(r.asset_path) + "</div>");
    if (r.preview_kind) lines.push("<div><strong>Kind:</strong> " + escapeHtml(r.preview_kind) + "</div>");
    if (r.verse_source) lines.push("<div><strong>Verse:</strong> " + escapeHtml(r.verse_source) + "</div>");
    document.getElementById("meta").innerHTML = lines.join("");
    document.getElementById("btn-mesh").hidden = !r.supports_mesh_preview;
    document.getElementById("btn-mat").hidden = !r.supports_material_preview;
    document.getElementById("btn-tex").hidden = !r.supports_texture_preview;
    if (!r.listener_online) setBanner("UEFN listener offline — showing local badge / cached preview.");
    else setBanner("");
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function showImage(url) {
    document.getElementById("status").hidden = true;
    document.getElementById("viewer").hidden = true;
    var wrap = document.getElementById("img-wrap");
    wrap.hidden = false;
    document.getElementById("thumb").src = url || "";
  }

  async function showMesh(media) {
    document.getElementById("status").hidden = true;
    document.getElementById("img-wrap").hidden = true;
    var host = document.getElementById("viewer");
    host.hidden = false;
    if (!viewer) {
      if (!window.UassetViewer) throw new Error("viewer.bundle.js missing — run npm run build:ui");
      viewer = window.UassetViewer.createViewer(host, { maxPixelRatio: 1.5 });
    }
    await viewer.setMedia(media);
  }

  async function loadHex() {
    try {
      var hex = await rpc("read_hex", { relative_path: filePath });
      if (hex && hex.content) {
        document.getElementById("hex-details").hidden = false;
        document.getElementById("hex").textContent = hex.content;
      }
    } catch (e) {}
  }

  async function boot() {
    await ensureFilePath();
    document.getElementById("title").textContent = basename(filePath);
    result = await rpc("preview_asset", { relative_path: filePath });
    renderMeta(result || {});
    if (result && result.preview_url && (result.mode === "texture" || result.mode === "material" || result.mode === "image" || result.mode === "badge" || result.mode === "asset" || result.mode === "verse")) {
      showImage(result.preview_url);
    } else {
      document.getElementById("status").textContent = "No thumbnail yet. Use the buttons above when UEFN is online.";
    }
    if (!result || result.listener_online === false || result.fallback) await loadHex();

    // Auto-load mesh / material / texture when kind is clear.
    if (result && result.supports_mesh_preview && result.listener_online) {
      document.getElementById("btn-mesh").click();
    } else if (result && result.supports_material_preview && result.listener_online) {
      document.getElementById("btn-mat").click();
    } else if (result && result.supports_texture_preview && result.listener_online) {
      document.getElementById("btn-tex").click();
    }
  }

  document.getElementById("btn-open").onclick = function () {
    showErr("");
    rpc("open_asset_in_uefn", { relative_path: filePath }).then(function (res) {
      if (res && res.ok === false) showErr(res.error || "Could not open in UEFN");
    }).catch(function (e) { showErr(e.message); });
  };
  document.getElementById("btn-copy").onclick = function () {
    var p = (result && result.asset_path) || "";
    if (p && navigator.clipboard) navigator.clipboard.writeText(p);
  };
  document.getElementById("btn-mesh").onclick = function () {
    showErr("");
    document.getElementById("status").hidden = false;
    document.getElementById("status").textContent = "Exporting StaticMesh FBX…";
    rpc("load_static_mesh_preview", { relative_path: filePath }).then(function (res) {
      if (!res || !res.media_url) throw new Error((res && res.error) || "Mesh export failed");
      return showMesh(res);
    }).catch(function (e) {
      document.getElementById("status").textContent = "";
      showErr(e.message);
      loadHex();
    });
  };
  document.getElementById("btn-mat").onclick = function () {
    showErr("");
    rpc("load_material_preview", { relative_path: filePath }).then(function (res) {
      if (!res || !res.preview_url) throw new Error((res && res.error) || "Material preview failed");
      result = Object.assign({}, result || {}, res);
      renderMeta(result);
      showImage(res.preview_url);
    }).catch(function (e) { showErr(e.message); });
  };
  document.getElementById("btn-tex").onclick = function () {
    showErr("");
    rpc("load_texture_preview", { relative_path: filePath }).then(function (res) {
      if (!res || !res.preview_url) throw new Error((res && res.error) || "Texture preview failed");
      result = Object.assign({}, result || {}, res);
      renderMeta(result);
      showImage(res.preview_url);
    }).catch(function (e) { showErr(e.message); });
  };

  boot().catch(function (e) {
    document.getElementById("status").textContent = "";
    showErr(e.message || String(e));
  });
})();
</script>
</body>
</html>
