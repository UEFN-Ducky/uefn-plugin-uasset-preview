<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Widget Preview</title>
  <style>
    :root {
      --bg: #1a1a1e; --surface: #242429; --text: #e8e8ec; --muted: #9a9aa3;
      --accent: #6c8cff; --border: #33333a; --err: #f07178; --warn: #e6d27a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, Segoe UI, sans-serif; }
    .pane { display: flex; flex-direction: column; height: 100%; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px;
      border-bottom: 1px solid var(--border); background: var(--surface); }
    .bar h1 { margin: 0 8px 0 0; font-size: 14px; font-weight: 600; }
    .bar .grow { flex: 1; }
    button, select { background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 9px; cursor: pointer; font: inherit; }
    button:hover, select:hover { border-color: var(--accent); }
    button.on { border-color: var(--accent); color: var(--accent); }
    .banner { padding: 6px 12px; background: #2a2a14; color: var(--warn); border-bottom: 1px solid var(--border); }
    .err { color: var(--err); padding: 10px 12px; }
    .main { flex: 1; min-height: 0; display: flex; }
    .stage { flex: 1; min-width: 0; position: relative; background: #0e0e11; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .side { width: 250px; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--border);
      background: var(--surface); min-height: 0; }
    .side h2 { margin: 0; padding: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted); }
    .list { padding: 0 6px 6px; overflow: auto; }
    .anim { display: flex; align-items: center; gap: 4px; padding: 3px 4px; border-radius: 5px; }
    .anim.active { background: #2e3350; }
    .anim .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .anim .dur { color: var(--muted); font-variant-numeric: tabular-nums; }
    .anim button { padding: 1px 6px; }
    #scrub { width: calc(100% - 20px); margin: 2px 10px 6px; }
    #log { flex: 1; min-height: 60px; margin: 0; padding: 4px 10px 8px; overflow: auto;
      font: 11px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; color: #c9d1e6; }
    .empty { color: var(--muted); padding: 2px 10px 8px; }
    .hover { color: var(--muted); padding: 4px 12px; border-top: 1px solid var(--border); background: var(--surface);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 27px; }
    @media (max-width: 620px) { .main { flex-direction: column; } .side { width: auto; max-height: 40%; border-left: 0; border-top: 1px solid var(--border); } }
  </style>
</head>
<body>
<div class="pane">
  <div class="bar">
    <h1 id="title">…</h1>
    <select id="res" title="Screen size">
      <option value="1920x1080">1920 × 1080</option>
      <option value="1280x720">1280 × 720</option>
      <option value="2560x1080">2560 × 1080 (ultrawide)</option>
      <option value="1280x800">1280 × 800 (Steam Deck)</option>
      <option value="2340x1080">2340 × 1080 (phone)</option>
    </select>
    <button type="button" id="btn-hints" title="Outline every clickable button">Show buttons</button>
    <button type="button" id="btn-mute">Mute</button>
    <span class="grow"></span>
    <button type="button" id="btn-reload">Reload</button>
    <button type="button" id="btn-details">Asset details</button>
  </div>
  <div id="banner" class="banner" hidden></div>
  <div id="err" class="err" hidden></div>
  <div class="main">
    <div class="stage"><canvas id="stage"></canvas></div>
    <div class="side">
      <h2>Animations</h2>
      <div class="list" id="anims"></div>
      <input type="range" id="scrub" min="0" max="1000" value="0" hidden />
      <h2 id="pages-title" hidden>Pages (widget switchers)</h2>
      <div class="list" id="pages" hidden></div>
      <h2>Events</h2>
      <pre id="log"></pre>
    </div>
  </div>
  <div class="hover" id="hover">Move the mouse over the widget; click its buttons.</div>
</div>
<script src="umg/engine.js"></script>
<script>
(function () {
  var CHANNEL = "uefn-plugin-ui";
  function call(method, params) {
    var id = crypto.randomUUID();
    return new Promise(function (resolve, reject) {
      var timer = window.setTimeout(function () {
        window.removeEventListener("message", onMsg);
        reject(new Error("Timed out talking to host"));
      }, 180000);
      function onMsg(ev) {
        var d = ev.data;
        if (ev.source !== parent || !d || d.channel !== CHANNEL || d.id !== id || typeof d.ok !== "boolean") return;
        window.clearTimeout(timer);
        window.removeEventListener("message", onMsg);
        if (d.ok) resolve(d.result); else reject(new Error(d.error || "bridge error"));
      }
      window.addEventListener("message", onMsg);
      parent.postMessage({ channel: CHANNEL, id: id, method: method, params: params || {} }, "*");
    });
  }
  function rpc(method, params) { return call("plugin.call", { method: method, params: params || {} }); }
  function $(id) { return document.getElementById(id); }

  var query = new URLSearchParams(location.search);
  var filePath = query.get("file") || "";
  var engine = null, scrubAnim = null, logLines = [];

  function log(line) {
    var t = new Date(), stamp = [t.getHours(), t.getMinutes(), t.getSeconds()].map(function (n) { return String(n).padStart(2, "0"); }).join(":");
    logLines.push(stamp + "  " + line);
    if (logLines.length > 200) logLines.shift();
    $("log").textContent = logLines.join("\n");
    $("log").scrollTop = $("log").scrollHeight;
  }
  function showErr(msg) { $("err").hidden = !msg; $("err").textContent = msg || ""; }

  function background(ctx, w, h) {
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#3b5a86"); g.addColorStop(0.6, "#6d8fae"); g.addColorStop(0.6, "#4f6b4a"); g.addColorStop(1, "#2f4330");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }

  function renderAnims(spec) {
    var host = $("anims");
    host.innerHTML = "";
    if (!spec.animations.length) { host.innerHTML = '<div class="empty">This widget has no animations.</div>'; return; }
    spec.animations.forEach(function (a) {
      var row = document.createElement("div");
      row.className = "anim"; row.dataset.name = a.name;
      var name = document.createElement("span"); name.className = "name"; name.textContent = a.name; name.title = a.name;
      var dur = document.createElement("span"); dur.className = "dur"; dur.textContent = (a.end - a.start).toFixed(2) + "s";
      var play = document.createElement("button"); play.textContent = "▶"; play.title = "Play once";
      var loop = document.createElement("button"); loop.textContent = "⟳"; loop.title = "Loop";
      play.onclick = function () { start(a, false); };
      loop.onclick = function () { start(a, true); };
      row.append(name, dur, play, loop);
      host.appendChild(row);
    });
    var stop = document.createElement("button");
    stop.textContent = "■ Stop and reset"; stop.style.margin = "4px";
    stop.onclick = function () { engine.stop(); markActive(""); $("scrub").hidden = true; };
    host.appendChild(stop);
  }
  // Which page a switcher shows is decided by Verse in game; here you flip it by hand.
  function renderPages() {
    var host = $("pages"), list = engine.switchers();
    host.innerHTML = ""; host.hidden = $("pages-title").hidden = !list.length;
    list.forEach(function (s) {
      var row = document.createElement("div"); row.className = "anim";
      var name = document.createElement("span"); name.className = "name"; name.textContent = s.label; name.title = s.label;
      var pos = document.createElement("span"); pos.className = "dur";
      var prev = document.createElement("button"); prev.textContent = "◀";
      var next = document.createElement("button"); next.textContent = "▶";
      var show = function (i) { s.active = engine.setSwitcher(s.id, i); pos.textContent = (s.active + 1) + " / " + s.count; };
      prev.onclick = function () { show(s.active - 1); }; next.onclick = function () { show(s.active + 1); };
      pos.textContent = (s.active + 1) + " / " + s.count;
      row.append(name, pos, prev, next); host.appendChild(row);
    });
  }
  function markActive(name) {
    Array.prototype.forEach.call(document.querySelectorAll(".anim"), function (el) { el.classList.toggle("active", el.dataset.name === name); });
  }
  function start(anim, loop) {
    scrubAnim = anim; $("scrub").hidden = false; markActive(anim.name);
    engine.play(anim.name, { loop: loop });
    log("▶ " + anim.name + (loop ? " (loop)" : ""));
    if (anim.audio.some(function (s) { return !(engine.spec.assets[s.sound] || {}).url; })) log("  (a sound of this animation is not available yet)");
  }

  function mediaBanner(res) {
    var m = res.media || {}, parts = [];
    if (m.images_thumbnail) parts.push(m.images_thumbnail + " image(s) shown from low-resolution thumbnails");
    if (m.images_missing) parts.push(m.images_missing + " image(s) missing");
    if (m.sounds_missing) parts.push(m.sounds_missing + " sound(s) not available");
    var text = parts.join(" · ");
    if (text) text += ". Supported textures use their original resolution; material effects may still use thumbnails.";
    if (!res.oodle_available && !res.listener_online && (m.images_thumbnail || m.sounds_missing)) text += " Offline media decoding is unavailable in this Python environment.";
    (res.spec.warnings || []).forEach(function (w) { text += (text ? " " : "") + w; });
    $("banner").hidden = !text; $("banner").textContent = text;
  }

  function mount(res) {
    if (engine) engine.dispose();
    var spec = res.spec;
    $("title").textContent = spec.name;
    if (!spec.root) { showErr("This Widget Blueprint has an empty tree."); return; }
    engine = window.UmgEngine.create($("stage"), spec, { drawBackground: background });
    applyRes();
    engine.setHints($("btn-hints").classList.contains("on"));
    engine.setMuted($("btn-mute").classList.contains("on"));
    engine.on(function (type, d) {
      if (type === "click") log("CLICK  " + d.label + (d.text ? '  "' + d.text + '"' : ""));
      else if (type === "hover") log("hover  " + d.label);
      else if (type === "pointer") $("hover").textContent = d.widget ? d.kind + "  " + d.label + (d.label !== d.widget ? "  (" + d.widget + ")" : "") : "—";
      else if (type === "animation" && scrubAnim && d.time != null) {
        var span = scrubAnim.end - scrubAnim.start;
        $("scrub").value = span > 0 ? Math.round(1000 * (d.time - scrubAnim.start) / span) : 0;
        if (d.state === "finished") log("■ " + d.name + " finished");
      }
    });
    renderAnims(spec);
    renderPages();
    mediaBanner(res);
    window.__umg = engine;
  }

  function applyRes() {
    if (!engine) return;
    var size = engine.spec.custom_size ? engine.spec.design_size : $("res").value.split("x").map(Number);
    $("res").disabled = !!engine.spec.custom_size;
    engine.setViewport(size[0], size[1]);
  }

  async function load() {
    showErr("");
    var res;
    if (window.__offlineDemo) res = window.__offlineDemo;
    else if (query.get("spec")) res = await (await fetch(query.get("spec"))).json(); // dev harness
    else {
      if (location.protocol === "file:" || parent === window) {
        $("title").textContent = "Preview UMG";
        $("btn-details").hidden = true;
        throw new Error("Cette page s’ouvre depuis Ducky. Pour essayer la preview dans un navigateur, ouvre le fichier HTML autonome exporté (par exemple preview-boutique-hd.html).");
      }
      if (!filePath) { var info = await call("plugin.info", {}); filePath = (info && info.filePath) || ""; }
      if (!filePath) throw new Error("No file path from host");
      res = await rpc("load_umg_preview", { relative_path: filePath });
    }
    if (!res || res.ok === false) throw new Error((res && res.error) || "Could not read the widget");
    mount(res);
  }

  $("res").onchange = applyRes;
  $("btn-hints").onclick = function () { this.classList.toggle("on"); if (engine) engine.setHints(this.classList.contains("on")); };
  $("btn-mute").onclick = function () { this.classList.toggle("on"); if (engine) engine.setMuted(this.classList.contains("on")); };
  $("btn-reload").onclick = function () { load().catch(function (e) { showErr(e.message || String(e)); }); };
  $("btn-details").onclick = function () { location.href = "asset.html?details=1&file=" + encodeURIComponent(filePath); };
  $("scrub").oninput = function () {
    if (!engine || !scrubAnim) return;
    engine.seek(scrubAnim.name, scrubAnim.start + (scrubAnim.end - scrubAnim.start) * this.value / 1000);
  };
  load().catch(function (e) { showErr(e.message || String(e)); });
})();
</script>
</body>
</html>
